name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check files parse and import cleanly
        run: |
          python -c "import ast; ast.parse(open('main.py').read()); print('main.py OK')"
          python -c "import ast; ast.parse(open('theme.py').read()); print('theme.py OK')"
          python -c "import ast; ast.parse(open('component_data.py').read()); print('component_data.py OK')"
          python -c "import ast; ast.parse(open('cmdx_tab.py').read()); print('cmdx_tab.py OK')"
          python -c "import ast; ast.parse(open('rotor_tab.py').read()); print('rotor_tab.py OK')"
          python -c "import ast; ast.parse(open('bearing_tab.py').read()); print('bearing_tab.py OK')"
          python -c "import ast; ast.parse(open('laser_tab.py').read()); print('laser_tab.py OK')"
          python -c "import ast; ast.parse(open('bearing_data.py').read()); print('bearing_data.py OK')"
          python -c "import bearing_data; print('bearing_data imports OK,', len(bearing_data.DATA['data']), 'brands')"

  build:
    needs: sanity-check
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hide unsupported system Python interpreters (>=3.13)
        run: |
          # python-for-android's master branch only supports Python up to 3.12.
          # This runner image ships a system Python 3.14 alongside our pinned
          # 3.11 from actions/setup-python; if p4a discovers 3.14 on PATH for
          # one of its internal build venvs, it breaks with a pip internals
          # ImportError. Hide anything >=3.13 so only 3.11 is ever found.
          for v in 3.13 3.14 3.15; do
            for p in /usr/bin/python$v /usr/local/bin/python$v; do
              if [ -e "$p" ]; then
                echo "Hiding $p"
                sudo mv "$p" "$p.disabled" || true
              fi
            done
          done
          echo "python3 now resolves to: $(which python3) ($(python3 --version))"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cm-toolkit-apk
          path: bin/*.apk
