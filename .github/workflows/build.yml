name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check files parse and import cleanly
        run: |
          python -c "import ast; ast.parse(open('main.py').read()); print('main.py OK')"
          python -c "import ast; ast.parse(open('theme.py').read()); print('theme.py OK')"
          python -c "import ast; ast.parse(open('component_data.py').read()); print('component_data.py OK')"
          python -c "import ast; ast.parse(open('cmdx_tab.py').read()); print('cmdx_tab.py OK')"
          python -c "import ast; ast.parse(open('rotor_tab.py').read()); print('rotor_tab.py OK')"
          python -c "import ast; ast.parse(open('bearing_tab.py').read()); print('bearing_tab.py OK')"
          python -c "import ast; ast.parse(open('laser_tab.py').read()); print('laser_tab.py OK')"
          python -c "import ast; ast.parse(open('bearing_data.py').read()); print('bearing_data.py OK')"
          python -c "import bearing_data; print('bearing_data imports OK,', len(bearing_data.DATA['data']), 'brands')"

  build:
    needs: sanity-check
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hide unsupported system Python interpreters (>=3.13)
        run: |
          # python-for-android's master branch only supports Python up to 3.12.
          # GitHub's runner image pre-installs SEVERAL Python versions under
          # /opt/hostedtoolcache/Python/ (not just the one actions/setup-python
          # puts on PATH), and p4a's internal build venv creation appears to
          # prefer the newest one it can find anywhere on disk. Do a filesystem
          # sweep (not just a couple of guessed paths) to disable every
          # python3.13+ binary, then rebuild PATH so only our pinned 3.11 is
          # visible at all during the build.
          echo "Searching for python3.13+ binaries..."
          sudo find /opt /usr /home -xdev -type f \( -name "python3.13" -o -name "python3.14" -o -name "python3.15" \) 2>/dev/null | while read -r f; do
            echo "Disabling: $f"
            sudo chmod -x "$f" 2>/dev/null || true
            sudo mv "$f" "$f.disabled" 2>/dev/null || true
          done

          # Rebuild PATH to only include our pinned 3.11 interpreter's bin dir
          # plus non-Python system paths, so nothing newer can be discovered
          # via PATH lookup either.
          PY311_BIN="$(dirname "$(which python3)")"
          echo "Pinned interpreter bin dir: $PY311_BIN"
          echo "$PY311_BIN" >> "$GITHUB_PATH"

          echo "python3 now resolves to: $(which python3) ($(python3 --version))"
          echo "Remaining python3.1x binaries on disk (should be none, or only .disabled):"
          sudo find /opt /usr /home -xdev -type f -name "python3.1*" 2>/dev/null

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cm-toolkit-apk
          path: bin/*.apk
